; Ajustes de PHP para hosting compartido con PHP-FPM/FastCGI (IONOS), donde
; no hay acceso a php.ini y .htaccess no puede tocar estos valores.
; PHP-FPM relee .user.ini cada pocos minutos (user_ini.cache_ttl, 300s por
; defecto) sin necesitar reinicio.

session.cookie_httponly = 1
session.cookie_samesite = Lax
display_errors = 0
log_errors = 1

; Subida directa de imágenes de cromos/escudos (partials/subida_imagen.php,
; tope interno de 6 MB) necesita que el servidor permita al menos eso.
upload_max_filesize = 8M
post_max_size = 10M

; El importador de datos oficiales (panel/importar.php) puede tardar varios
; minutos descargando fotos por lote.
max_execution_time = 300
max_input_time = 300
