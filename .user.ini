; Ajustes de PHP para hosting compartido con PHP-FPM/FastCGI (IONOS), donde
; no hay acceso a php.ini y .htaccess no puede tocar estos valores.
; PHP-FPM relee .user.ini cada pocos minutos (user_ini.cache_ttl, 300s por
; defecto) sin necesitar reinicio.

session.cookie_httponly = 1
session.cookie_samesite = Lax
display_errors = 0
log_errors = 1

; ---- COMPRESIÓN DEL HTML ----
;
; Es un RESPALDO de la regla mod_deflate del .htaccess, no un duplicado: si el
; servidor trae mod_deflate, comprime él y esto no llega a actuar; si no lo
; trae, al menos el HTML —que es la respuesta más grande y la única que se
; genera en cada carga sin poder cachearse— sale comprimido igualmente.
;
; Las hojas y los scripts los sirve Apache directamente, así que a esos NO les
; llega: para ellos hace falta mod_deflate sí o sí. Si al desplegar ves que las
; .css siguen viniendo sin comprimir, es que falta ese módulo.
;
; Nivel 5 y no 9: en texto la diferencia de tamaño es de un 2 % y la de CPU es
; del triple, y aquí la CPU es de un plan compartido.
zlib.output_compression = On
zlib.output_compression_level = 5

; Subida directa de imágenes de cromos/escudos (partials/subida_imagen.php,
; tope interno de 6 MB) necesita que el servidor permita al menos eso.
upload_max_filesize = 8M
post_max_size = 10M

; El importador de datos oficiales (panel/importar.php) puede tardar varios
; minutos descargando fotos por lote.
max_execution_time = 300
max_input_time = 300
